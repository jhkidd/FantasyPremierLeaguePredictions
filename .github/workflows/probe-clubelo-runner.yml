name: Probe Club Elo runner connectivity

# Throwaway, one-off diagnostic (plan §7 Finding A / Risk R1). The sandbox's
# own curl got a 502 from api.clubelo.com while a different tool succeeded,
# which proves nothing about a real GitHub Actions runner's egress. This
# workflow answers that question directly, then gets deleted once answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS resolution for api.clubelo.com
        run: |
          getent hosts api.clubelo.com || true
          nslookup api.clubelo.com || true

      - name: Curl Club Elo from this runner (HTTP, bounded)
        run: |
          set -x
          today="$(date -u +%F)"
          curl -v --connect-timeout 8 --max-time 15 -o /tmp/body_http.txt -w "\nHTTP status: %{http_code}\n" \
            "http://api.clubelo.com/${today}" || echo "HTTP attempt exit code: $?"
          echo "--- body (http) ---"
          head -c 300 /tmp/body_http.txt || true
          echo

      - name: Curl Club Elo from this runner (HTTPS, bounded)
        run: |
          set -x
          today="$(date -u +%F)"
          curl -v --connect-timeout 8 --max-time 15 -o /tmp/body_https.txt -w "\nHTTP status: %{http_code}\n" \
            "https://api.clubelo.com/${today}" || echo "HTTPS attempt exit code: $?"
          echo "--- body (https) ---"
          head -c 300 /tmp/body_https.txt || true
          echo
