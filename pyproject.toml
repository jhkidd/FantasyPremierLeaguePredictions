[project]
name = "fpl"
version = "0.1.0"
description = "Fantasy Premier League prediction system — data layer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "tzdata>=2026.3",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.1",
    "scipy>=1.18.0",
]

[project.scripts]
fpl = "fpl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 'src' makes `import fpl` work without the package being installed (though it
# also is installed, via the project's own build-system, so this is mostly
# belt-and-braces); '.' puts the repo root on sys.path so test modules can
# cross-import each other as `tests.features.test_library` etc. Without this,
# `uv run pytest` (no `-m`, unlike `python -m pytest`) never gets the repo
# root onto sys.path and fails to collect tests/features/test_no_leakage.py.
pythonpath = ["src", "."]
filterwarnings = ["error"]
